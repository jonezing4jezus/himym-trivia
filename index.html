<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

       and frames the real app full-screen. -->

  <style>
    html, body { margin: 0; height: 100%; background: #0f261d; overflow: hidden; }

      font: 700 17px system-ui, sans-serif; color: #fff; padding: 24px; z-index: -1;
